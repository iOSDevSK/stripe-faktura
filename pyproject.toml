[project]
name = "stripe-faktura"
version = "0.1.0"
description = "Generátor slovenských faktúr pre Stripe platby"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Filip Dvoran", email = "filip.dvoran@gmail.com" },
]
keywords = ["stripe", "invoice", "faktura", "slovakia", "slovensko", "fakturacia", "pdf", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "stripe>=11.0",
    "weasyprint>=63",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
s3 = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.22",
]

[project.urls]
Homepage = "https://github.com/iOSDevSK/stripe-faktura"
Repository = "https://github.com/iOSDevSK/stripe-faktura"
Issues = "https://github.com/iOSDevSK/stripe-faktura/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stripe_faktura"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID"]
ignore = ["E501"]  # dlhý riadok (limit 100; inline CSS môže prekročiť)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
